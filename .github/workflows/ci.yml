name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # Skipped while the repository is private (paid minutes); runs on demand.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localizations
        working-directory: apps/desktop
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test packages
        run: |
          foreach ($package in Get-ChildItem packages -Directory) {
            Push-Location $package.FullName
            dart test
            $code = $LASTEXITCODE
            Pop-Location
            if ($code -ne 0) { exit $code }
          }

      - name: Test app
        working-directory: apps/desktop
        run: flutter test

      - name: Build Windows app
        working-directory: apps/desktop
        run: flutter build windows --release
