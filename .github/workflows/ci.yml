name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Parallel jobs (#126): Linux where the tests allow it (faster setup),
# integration tests in Windows batches, app coverage gate on the merged
# reports.
env:
  FLUTTER_VERSION: 3.50.1
  # Integration batches: keep in sync with the `integration` matrix.
  BATCHES: 3

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter gen-l10n
        working-directory: apps/desktop
      - run: flutter analyze

  packages:
    # Windows: the repository tests expect Windows path separators.
    # Skipped while the repository is private (paid minutes); runs on demand.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Test with coverage gate
        run: dart tool/coverage.dart packages

  widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cnativeapi (window_manager, tray_manager) compiles its C++ core on Linux.
      - name: Install Linux build packages
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
        working-directory: apps/desktop
      - name: Test with coverage
        run: dart tool/coverage.dart --no-gate widget
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-widget
          path: coverage/app-widget.lcov
          if-no-files-found: error

  golden:
    # Golden images are rendered by the system font stack: compared on Windows
    # only, where they are generated (#179). Every other widget test runs on
    # Linux. Skipped while the repository is private (paid minutes); runs on demand.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
        working-directory: apps/desktop
      - name: Compare the golden tests
        working-directory: apps/desktop
        run: |
          # `flutter test --tags golden` fails when no test carries the tag.
          if (Get-ChildItem test/goldens -Recurse -Filter *_test.dart -ErrorAction SilentlyContinue) {
            flutter test --tags golden test/goldens
            exit $LASTEXITCODE
          }
          Write-Host 'No golden test yet.'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures
          path: apps/desktop/test/**/failures/
          if-no-files-found: warn

  integration:
    # Skipped while the repository is private (paid minutes); runs on demand.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        batch: [1, 2, 3]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
        working-directory: apps/desktop
      - name: Test with coverage
        run: dart tool/coverage.dart --no-gate --batch=${{ matrix.batch }}/${{ env.BATCHES }} integration 2>&1 | Tee-Object -FilePath apps/desktop/integration-output.txt; exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-integration-${{ matrix.batch }}
          path: coverage/app-integration-*.lcov
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-integration-${{ matrix.batch }}
          path: |
            apps/desktop/build/integration_failures
            apps/desktop/integration-output.txt
          if-no-files-found: ignore

  coverage:
    needs: [widget, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true
      - name: App coverage gate
        run: dart tool/coverage.dart --gate-only app

  build:
    # Skipped while the repository is private (paid minutes); runs on demand.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
        working-directory: apps/desktop
      - name: Build Windows app
        working-directory: apps/desktop
        run: flutter build windows --release

  build-native:
    # Main only (and on demand): free runners, but long macOS builds.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux build packages
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev
      - run: flutter pub get
      - run: flutter gen-l10n
        working-directory: apps/desktop
      - name: Build ${{ matrix.target }} app
        working-directory: apps/desktop
        env:
          # tray_manager is built with -Werror and uses a deprecated
          # libayatana-appindicator function.
          CFLAGS: -Wno-error=deprecated-declarations
          CXXFLAGS: -Wno-error=deprecated-declarations
        run: flutter build ${{ matrix.target }} --release
      - name: Integration tests (macOS)
        if: matrix.target == 'macos'
        run: dart tool/coverage.dart --no-gate --device=macos integration 2>&1 | tee apps/desktop/integration-output.txt; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.target == 'macos'
        with:
          name: failure-integration-macos
          path: |
            apps/desktop/build/integration_failures
            apps/desktop/integration-output.txt
          if-no-files-found: ignore
