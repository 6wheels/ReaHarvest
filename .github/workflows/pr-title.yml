name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title is Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^()]+\))?!?: [^ ].*$'
          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "Title ok: $PR_TITLE"
          else
            echo "::error::Title \"$PR_TITLE\" is not Conventional Commits. Expected: <type>[(scope)][!]: <description>, type one of feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert."
            exit 1
          fi
