name: reaharvest
description: Collaborative REAPER project manager (desktop app).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  intl: ^0.20.3
  path: ^1.9.1
  reaharvest_domain:
    path: ../../packages/domain
  reaharvest_index:
    path: ../../packages/index
  reaharvest_library:
    path: ../../packages/library

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/Inter-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
