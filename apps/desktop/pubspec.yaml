name: reaharvest
description: Collaborative REAPER project manager (desktop app).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  intl: ^0.20.3
  cupertino_ui: ^1.1.7
  logging: ^1.3.0
  material_ui: ^1.11.1
  path: ^1.9.1
  tray_manager: ^0.9.1
  window_manager: ^0.7.1
  reaharvest_domain:
    path: ../../packages/domain
  reaharvest_index:
    path: ../../packages/index
  reaharvest_library:
    path: ../../packages/library
  reaharvest_reaper:
    path: ../../packages/reaper
  reaharvest_repository:
    path: ../../packages/repository
  reaharvest_rpp:
    path: ../../packages/rpp

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test_api: ^0.7.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt
    - assets/third_party/reaper/reaper.png
    - assets/tray/tray_icon.ico
    - assets/brand/reaharvest-1024.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
